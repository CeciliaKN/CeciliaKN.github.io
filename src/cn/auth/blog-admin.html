<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>博客管理 | La Grand Bibliothèque</title>
    <link rel="icon" href="/src/indexbcg.png" type="image/x-icon">
    <link rel="shortcut icon" href="/src/indexbcg.png" type="image/x-icon">
    <meta name="description" content="博客管理工具">
    <meta name="author" content="Lilia">
    <link href="/src/css/bootstrap.min.css" rel="stylesheet">
    <link href="/src/css/main_style.css" rel="stylesheet">
    <link href="/src/css/admin-style.css" rel="stylesheet">
</head>
<body>
    <!-- Header组件容器 -->
    <div id="header-container"></div>

    <div id="loading" class="loading-spinner">
        <div class="spinner"></div>
        <p>正在验证权限...</p>
    </div>

    <div id="access-denied" class="admin-container" style="display: none;">
        <div class="admin-header">
            <h1>访问被拒绝</h1>
            <p>此功能仅限管理员使用</p>
            <a href="/src/cn/auth/profile.html" class="btn btn-primary">返回个人中心</a>
        </div>
    </div>

    <div id="admin-content" class="admin-container" style="display: none;">
        <a href="/src/cn/auth/profile.html" class="back-link">← 返回个人中心</a>
        
        <div class="admin-header">
            <h1>内容管理中心</h1>
            <p>创建和管理您的博客文章与文学作品</p>
        </div>

        <!-- 标签页 -->
        <div class="admin-tabs">
            <div class="admin-tab active" onclick="switchTab('create')">创建内容</div>
            <div class="admin-tab" onclick="switchTab('manage')">管理内容</div>
        </div>

        <!-- 创建内容标签页 -->
        <div id="create-tab" class="tab-content active">
            <div class="alert" id="create-alert"></div>
            
            <form id="createContentForm">
                <div class="form-section">
                    <h3>基本信息</h3>
                    
                    <div class="form-group">
                        <label for="contentType">内容类型</label>
                        <div class="category-grid" style="grid-template-columns: repeat(2, 1fr);">
                            <div class="category-option content-type-option" data-type="blog">
                                博客文章
                            </div>
                            <div class="category-option content-type-option" data-type="literature">
                                花物语·文选
                            </div>
                        </div>
                        <input type="hidden" id="selectedContentType" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="contentTitle">标题</label>
                        <input type="text" id="contentTitle" class="form-control" required 
                               placeholder="请输入标题">
                    </div>
                    
                    <div class="form-group">
                        <label for="contentCategory">分类</label>
                        <div id="blog-categories" class="category-grid" style="display: none;">
                            <div class="category-option category-blog" data-category="迷思">
                                迷思
                            </div>
                            <div class="category-option category-blog" data-category="文论">
                                文论
                            </div>
                            <div class="category-option category-blog" data-category="日程">
                                日程
                            </div>
                            <div class="category-option category-blog" data-category="公告">
                                公告
                            </div>
                            <div class="category-option category-blog" data-category="随笔">
                                随笔
                            </div>
                            <div class="category-option category-blog" data-category="技术">
                                技术
                            </div>
                        </div>
                        <div id="literature-categories" class="category-grid" style="display: none;">
                            <div class="category-option category-literature" data-category="百合花开">
                                百合花开
                            </div>
                            <div class="category-option category-literature" data-category="现代诗集">
                                现代诗集
                            </div>
                            <div class="category-option category-literature" data-category="诗词歌赋">
                                诗词歌赋
                            </div>
                            <div class="category-option category-literature" data-category="翻译作品">
                                翻译作品
                            </div>
                            <div class="category-option category-literature" data-category="文学心得">
                                文学心得
                            </div>
                        </div>
                        <input type="hidden" id="selectedCategory" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="contentDate">发表日期</label>
                        <input type="date" id="contentDate" class="form-control" required>
                    </div>
                    
                    <div class="form-group" id="location-group">
                        <label for="contentLocation">地理位置</label>
                        <input type="text" id="contentLocation" class="form-control" 
                               placeholder="例如：东京都文京区，东京大学">
                    </div>
                    
                    <div class="form-group" id="literature-date-group" style="display: none;">
                        <label for="literatureDate">作品日期</label>
                        <input type="text" id="literatureDate" class="form-control" 
                               placeholder="例如：公元2026年1月10日">
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>内容</h3>
                    
                    <div class="form-group">
                        <label for="contentText">正文内容</label>
                        <textarea id="contentText" class="form-control textarea-large" required
                                  placeholder="请输入正文内容..."></textarea>
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>操作</h3>
                    <button type="button" class="btn btn-secondary" onclick="previewContent()">
                        预览效果
                    </button>
                    <button type="submit" class="btn btn-success">
                    发布内容
                    </button>
                </div>
            </form>
            
            <!-- 预览区域 -->
            <div id="previewSection" style="display: none;">
                <div class="preview-container">
                    <div class="preview-header">内容预览</div>
                    <div id="previewContent"></div>
                </div>
            </div>
        </div>

        <!-- 管理内容标签页 -->
        <div id="manage-tab" class="tab-content">
            <div class="alert" id="manage-alert"></div>
            
            <div class="form-section">
                <h3>内容列表</h3>
                <p>管理您的博客文章和文学作品。注意：删除操作不可恢复，请谨慎操作</p>
                
                <button class="btn btn-primary" onclick="refreshContentList()">
                    🔄 刷新列表
                </button>
                
                <div id="blogList" class="blog-list">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p>正在加载内容列表...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/src/js/jquery.min.js"></script>
    <script src="/src/js/bootstrap.min.js"></script>
    <script src="/src/js/scripts.js"></script>
    <script src="/src/js/header-component.js"></script>
    <script src="/src/js/blog-auth-sdk.js"></script>
    <script src="/src/js/admin-manager.js"></script>
</body>
</html>
