        很想念当年在上海一起玩乐队的朋友们。
            在我现在遇到困难的时候他们仍然会伸出援手。
            本来出逃我是没有软肋无忧无虑的，不过现在总是会想回上海找他们见一见。
            不过人总有散的时候，他们也会有自己的工作，离开曾经相聚的地方。第一次演出、以前经常聚会的livehouse现在也已经关门倒闭了。总有一天，这座城市就再也没有我们曾经聚会过的证据。
            嘛，毕竟一期一会嘛。
            就像我本来的音乐梦也在逐渐消散一样。
