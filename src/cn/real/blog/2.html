      <div class="content">
        说到诗心，我之前有思考过它的三个组成。
        辞法，文法，情法。
        正对应着圣父圣子圣神一样。
        辞法主要指的是字韵、平仄是否合法，着重单字的推敲和用字（并非完全对应，推敲单字时也会牵扯到其他两项）；
        文法，主要指语言的正确使用，例如汉语古诗词的对仗、日语的语法结构和语法游戏（双关等），着重于单词与单词之间的联系；
        情法，指的是内容、抒情或景物包含的情思，是其文的整体气氛。
        它们互不隶属互不覆盖，但都是"诗心"此一体的组成部分。
      </div>
